<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/calendar-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="A picture-based, accessible calendar for people who don't read or write and have little concept of time."
    />
    <title>Picture Calendar</title>
  </head>
  <body>
    <div id="root">
      <!-- Fallback shown until the app's JavaScript loads and renders.
           If you ever see this text stuck on screen, the app script failed
           to load (rather than a truly blank page). -->
      <div style="font-family: system-ui, sans-serif; text-align: center; padding: 48px 20px; color: #475569;">
        <div style="font-size: 40px;">🗓️</div>
        <p style="font-size: 20px; font-weight: 700;">Loading Picture Calendar…</p>
        <noscript>
          <p style="color: #dc2626;">This app needs JavaScript to be enabled in your browser.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
